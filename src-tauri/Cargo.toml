[package]
name = "studyanalyzer"
description = "Read one biomedical paper closely"
version.workspace = true
edition.workspace = true
license.workspace = true

# staticlib: iOS; cdylib: Android; rlib: the desktop binary (as in hanzitutor).
[lib]
name = "studyanalyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studyanalyzer-core = { path = "../crates/studyanalyzer-core" }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# `keyring`: API keys in the OS keychain (`bmlib::secrets::KeyringVault`).
bmlib = { workspace = true, features = ["keyring"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

# Desktop only: a second launch hands its arguments to the first, and the
# deep-link feature forwards a link argument to tauri-plugin-deep-link.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
uuid.workspace = true
# The mock runtime, so the contract test can invoke every command.
tauri = { version = "2", features = ["test"] }
