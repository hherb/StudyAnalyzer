[package]
name = "studyanalyzer"
description = "Read one biomedical paper closely"
version.workspace = true
edition.workspace = true
license.workspace = true

# staticlib: iOS; cdylib: Android; rlib: the desktop binary (as in hanzitutor).
[lib]
name = "studyanalyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studyanalyzer-core = { path = "../crates/studyanalyzer-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
bmlib.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[dev-dependencies]
uuid.workspace = true
