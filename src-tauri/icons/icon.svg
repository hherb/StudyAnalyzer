<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source of every icon in this folder: `pnpm tauri icon src-tauri/icons/icon.png` after rendering this to 1024px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4f7e"/>
      <stop offset="1" stop-color="#1f3a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px body centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- The paper -->
  <g filter="url(#shadow)">
    <path d="M300 200 H640 L724 284 V824 H300 Z" fill="#fbfaf6"/>
    <path d="M640 200 V284 H724 Z" fill="#e6e2d8"/>
  </g>

  <!-- Title -->
  <rect x="352" y="262" width="230" height="26" rx="13" fill="#1f3a5f"/>

  <!-- Text lines; an earlier citation, then the current one -->
  <rect x="340" y="378" width="344" height="46" rx="8" fill="#f6e7b0"/>
  <rect x="340" y="534" width="344" height="46" rx="8" fill="#e8b931"/>
  <g fill="#9aa3b2">
    <rect x="352" y="334" width="320" height="16" rx="8"/>
    <rect x="352" y="393" width="300" height="16" rx="8"/>
    <rect x="352" y="452" width="320" height="16" rx="8"/>
    <rect x="352" y="496" width="250" height="16" rx="8"/>
    <rect x="352" y="549" width="320" height="16" rx="8"/>
    <rect x="352" y="608" width="290" height="16" rx="8"/>
    <rect x="352" y="652" width="320" height="16" rx="8"/>
    <rect x="352" y="696" width="200" height="16" rx="8"/>
  </g>

  <!-- The chat bubble -->
  <g filter="url(#shadow)">
    <path d="M236 600 H520 a52 52 0 0 1 52 52 V770 a52 52 0 0 1 -52 52 H350 L272 880 L286 822 H236 a52 52 0 0 1 -52 -52 V652 a52 52 0 0 1 52 -52 Z" fill="#eef2f7"/>
  </g>
  <!-- Quote marks -->
  <g fill="#1f3a5f">
    <path d="M262 742 q0 -64 58 -84 l10 22 q-30 14 -32 40 h28 v58 h-64 Z"/>
    <path d="M370 742 q0 -64 58 -84 l10 22 q-30 14 -32 40 h28 v58 h-64 Z"/>
  </g>
  <rect x="470" y="726" width="64" height="16" rx="8" fill="#e8b931"/>
  <rect x="470" y="762" width="44" height="16" rx="8" fill="#9aa3b2"/>
</svg>
