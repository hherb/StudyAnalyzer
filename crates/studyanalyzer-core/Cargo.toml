[package]
name = "studyanalyzer-core"
description = "Pure, Tauri-free logic of StudyAnalyzer, built on bmlib"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bmlib.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
log.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
rusqlite.workspace = true
base64 = "0.23"
url = "2"

# The library folder's security-scoped bookmark (`bookmark.rs`); already in the tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSData", "NSError", "NSString", "NSArray"] }
